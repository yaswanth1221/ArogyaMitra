services:
  - type: web
    name: arogyamitra
    runtime: static
    rootDir: FULL_CODE/web
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
